name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install display and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libmtdev1t64 shellcheck
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r src/requirements.txt -r src/requirements-dev.txt -r src/requirements-build.txt
      - name: Audit Python dependencies
        run: python -m pip_audit --strict
      - name: Check code and tests
        run: xvfb-run -a make quality
        env:
          QUALITY_PYTHON: python
          KIVY_NO_FILELOG: '1'
      - name: Check Bash scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x
      - name: Verify bundled recipe images
        run: python scripts/images/verify_recipe_images.py

  linux:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install build display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libmtdev1t64
      - name: Build AppImage
        run: xvfb-run -a make compile-linux
        env:
          PYTHON_BIN: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooking-planner-linux-x86_64
          path: dist/linux/CookingPlanner-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  windows-scripts:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell syntax errors in $($_.FullName): $errors" }
          }

  windows:
    if: github.event_name != 'pull_request'
    needs: [quality, windows-scripts]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        timeout-minutes: 30
        run: ./scripts/build/windows/build-windows.ps1
        env:
          PYTHON_BIN: python
          COOKING_PLANNER_BUILD_VERBOSE: '1'
          # PyInstaller scans Kivy imports on a runner without usable OpenGL.
          KIVY_WINDOW: mock
      - name: Check installed Windows package
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'CookingPlannerInstall'
          $installer = (Resolve-Path 'dist/windows/CookingPlanner-Setup.exe').Path
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$target"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $executable = Join-Path $target 'CookingPlanner.exe'
          if (-not (Test-Path $executable -PathType Leaf)) { throw 'Installed executable is missing' }
          $env:KIVY_NO_ARGS = '1'
          $check = Start-Process -FilePath $executable -ArgumentList '--verify-package' `
            -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed package check failed with exit code $($check.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooking-planner-windows-x86_64
          path: dist/windows/CookingPlanner-Setup.exe
          if-no-files-found: error
          compression-level: 0
