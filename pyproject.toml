[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooking-planner-desktop"
version = "0.1.0"
description = "Kivy desktop client for Cooking Planner"
requires-python = ">=3.11,<3.15"
dependencies = [
    "Kivy==2.3.1; python_version < '3.14'",
    "Kivy>=3.0.0.dev0; python_version >= '3.14'",
]

[project.scripts]
cooking-planner = "cooking_planner.launcher:main"

[tool.setuptools]
package-dir = {"" = "desktop"}

[tool.setuptools.packages.find]
where = ["desktop"]
include = ["cooking_planner*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
